<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>My Neighbor Is In A Book</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --bg: #0c1220;
    --panel: #101828;
    --border: #1f2937;
    --text: #e8ecf3;
    --muted: #8b96a8;
    --accent: #38bdf8;
    --accent-dark: #0891b2;
    --pin: #3fc7ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 14px 22px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    z-index: 500;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-right: 8px;
  }
  .brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(160deg, var(--accent), var(--accent-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .brand-icon svg { width: 20px; height: 20px; stroke: #071019; }
  .brand-text h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .brand-text p {
    font-size: 12px;
    color: var(--muted);
    margin: 2px 0 0;
  }

  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    stroke: var(--muted);
  }
  .search-wrap input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px 9px 34px;
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-wrap input:focus { border-color: var(--accent); }

  .count-badge {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    background: var(--bg);
  }
  .count-badge svg { width: 14px; height: 14px; stroke: var(--accent); }

  .suggest-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #071019;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease;
  }
  .suggest-btn:hover { background: #5fd0ff; }
  .suggest-btn svg { width: 14px; height: 14px; stroke: #071019; }

  #map {
    flex: 1;
    background: var(--bg);
  }

  /* Custom pin marker */
  .pin {
    width: 30px;
    height: 30px;
    border-radius: 50% 50% 50% 0;
    background: var(--pin);
    border: 2px solid #eafcff;
    transform: rotate(-45deg);
    box-shadow: 0 0 0 3px rgba(63,199,255,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pin svg {
    transform: rotate(45deg);
    width: 13px;
    height: 13px;
    stroke: #071019;
  }

  .leaflet-popup-content-wrapper {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .leaflet-popup-tip { background: var(--panel); }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; }
  .leaflet-popup-content b { color: var(--accent); }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }

  @media (max-width: 640px) {
    header { gap: 10px; }
    .brand-text p { display: none; }
    .count-badge span.label { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
      </div>
      <div class="brand-text">
        <h1>my neighbor is in a book</h1>
        <p>Real-world addresses where fictional characters live · Regional ambient radio</p>
      </div>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Search by book, author, or address..." />
    </div>

    <div class="count-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span id="countLabel"><span id="countNum">0</span> <span class="label">Addresses</span></span>
    </div>

    <button class="suggest-btn" onclick="alert('Formulaire à brancher ici')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Suggest a Location
    </button>
  </header>

  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // Remplace ces entrées par tes propres adresses/livres
  const locations = [
    { title: "221B Baker Street", book: "Sherlock Holmes", lat: 51.5237, lng: -0.1585 },
    { title: "4 Privet Drive", book: "Harry Potter", lat: 52.4862, lng: -1.8904 },
    { title: "12 Grimmauld Place", book: "Harry Potter", lat: 51.5, lng: -0.12 },
    { title: "Rue Cardinal Lemoine", book: "Le Fantôme de l'Opéra", lat: 48.8462, lng: 2.3499 },
    { title: "Calle de Alcalá", book: "Fortunata y Jacinta", lat: 40.4198, lng: -3.6942 },
    { title: "Ulica Miodowa", book: "Lalka", lat: 53.1235, lng: 23.1688 }
  ];

  const map = L.map('map', {
    zoomControl: true,
    attributionControl: true
  }).setView([49, 6], 4);

  // Fond de carte sombre CARTO — gratuit, sans clé API
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  const pinIcon = L.divIcon({
    className: '',
    html: '<div class="pin"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></div>',
    iconSize: [30, 30],
    iconAnchor: [15, 28],
    popupAnchor: [0, -26]
  });

  locations.forEach(loc => {
    L.marker([loc.lat, loc.lng], { icon: pinIcon })
      .addTo(map)
      .bindPopup(`<b>${loc.title}</b><br>${loc.book}`);
  });

  document.getElementById('countNum').textContent = locations.length;

  // Recherche simple : centre la carte sur le premier résultat correspondant
  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) return;
    const match = locations.find(l =>
      l.title.toLowerCase().includes(q) || l.book.toLowerCase().includes(q)
    );
    if (match) map.setView([match.lat, match.lng], 8);
  });
</script>
</body>
</html>
